
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiqa-app
  namespace: fiqa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fiqa-app
  template:
    metadata:
      labels:
        app: fiqa-app
    spec:
      containers:
        - name: fiqa-container
          image: kaushal11/fiqa:latest
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: fiqa-service
  namespace: fiqa
spec:
  selector:
    app: fiqa-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fiqa-ingress
  namespace: fiqa
  annotations:
    cert-manager.io/cluster-issuer: "lets-encrypt" 
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/redirect-entrypoint: websecure
spec:
  rules:
    - host: fiqa.kk11.com.np
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fiqa-service
                port:
                  number: 80
  tls:
    - hosts:
        - fiqa.kk11.com.np
      secretName: fiqa-tls-secret